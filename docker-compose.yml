version: '3.8'

services:
  bot:
    build: .
    container_name: discord-sales-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
    networks:
      - bot-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: discord-sales-dashboard
    restart: unless-stopped
    env_file:
      - ./dashboard/.env
    ports:
      - "3001:3001"
    networks:
      - bot-network
    depends_on:
      - bot

networks:
  bot-network:
    driver: bridge
